<!doctype html>
<!--
  The page a host names (ADR 0047), for the playground. It writes no html: it
  hands it to a frame it isolates, as a host must. A real host also gives that
  frame its own response, with its policy and `sandbox allow-scripts`.
-->
<meta charset="utf-8" />
<title>html frame</title>
<style>
  html,
  body,
  iframe {
    width: 100%;
    height: 100%;
    margin: 0;
    border: 0;
    display: block;
  }
</style>
<iframe sandbox="allow-scripts"></iframe>
<script>
  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    if (typeof event.data?.html !== 'string') return;
    document.querySelector('iframe').srcdoc = event.data.html;
  });
  window.parent.postMessage({ type: 'labre:embed-html-ready' }, '*');
</script>
