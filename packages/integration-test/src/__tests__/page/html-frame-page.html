<!doctype html>
<!--
  The page ADR 0047 asks of a host, for `attachment-html.spec.ts`: it writes no
  html and hands it to a frame it isolates.
-->
<meta charset="utf-8" />
<title>html frame</title>
<iframe sandbox="allow-scripts"></iframe>
<script>
  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    if (typeof event.data?.html !== 'string') return;
    document.querySelector('iframe').srcdoc = event.data.html;
  });
  window.parent.postMessage({ type: 'labre:embed-html-ready' }, '*');
</script>
