name: Test

on:
  push:
    branches:
      - trimed-lib
  pull_request:
  workflow_dispatch:
  # Post-merge safety net for blocksuite-labre-main (the default branch, which
  # schedule runs against): merges land without their own CI run — two PRs green
  # in isolation can still break main (semantic conflict, e.g. PR #129) — and a
  # per-push run would cost one full suite per merge. One nightly run bounds
  # detection to 24h instead.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run format check
        run: yarn lint:format

  typecheck:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Advisory only: the `highest` strategy drifts with the npm registry over
      # time, so a red dedupe check must never mask the typecheck below.
      - name: Check dedupe
        continue-on-error: true
        run: yarn dedupe --check

      - name: Run build
        run: yarn build

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # framework/std runs its unit tests in browser mode (chromium).
      - name: Install playwright chromium
        run: yarn exec playwright install chromium --with-deps

      - name: Run unit tests
        run: yarn test:unit --retry=2

  integration-test:
    name: Integration Tests (browser)
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install playwright chromium
        run: yarn exec playwright install chromium --with-deps

      - name: Run integration tests
        run: yarn test:integration

  build-and-test:
    if: ${{ always() }}
    name: Build & Test
    needs: [lint, typecheck, unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: on error
        if: ${{ needs.lint.result != 'success' || needs.typecheck.result != 'success' || needs.unit-test.result != 'success' || needs.integration-test.result != 'success' }}
        run: exit 1
